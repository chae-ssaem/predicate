<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>용언 식당</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 상단 영업 바 → 손님 카운터(좌석 3개) → 주방 작업대. 좁으면 1단 */
:root{
  color-scheme: light;
  --wall:#FBEBD3; --tile-a:#F6DDBB; --tile-b:#FFF4E2;
  --wood:#B7743D; --wood-d:#8A5226; --counter:#E2553F; --counter-d:#B33A27;
  --paper:#FFFDF6; --ink:#2A2320; --muted:#6E625A; --line:#E7DCCB;
  --stem:#2F7DD1; --stem-bg:#E3F0FD; --end:#E07A1F; --end-bg:#FFEBD6;
  --ok:#239A5B; --no:#D8443A; --gold:#F3B53B; --mint:#DDF3E6;
  --f-display:'Do Hyeon','Noto Sans KR',system-ui,sans-serif;
  --f-word:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;background:var(--wall);
  background-image:linear-gradient(45deg,var(--tile-a) 25%,transparent 25%,transparent 75%,var(--tile-a) 75%),linear-gradient(45deg,var(--tile-a) 25%,transparent 25%,transparent 75%,var(--tile-a) 75%);
  background-size:44px 44px;background-position:0 0,22px 22px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-block:10px 14px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* 상단 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand small{font:800 10px/1 var(--f-body);letter-spacing:.18em;color:var(--counter)}
.brand b{font:400 30px/1.1 var(--f-display)}
.brand b.cs{font:900 18px/1 var(--f-body);letter-spacing:.16em;color:var(--counter)}
.top .sp{flex:1}
.stat{display:flex;align-items:center;gap:6px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:4px 12px;font:400 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink)}
.stat small{font:700 12px/1 var(--f-body);color:var(--muted)}
.stat.time.low{background:#FFE1DC;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-color:var(--no)}}
.ibtn{background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* 식당 장면: 배경 그림 + 손님 층 + 카운터 앞판 + 말풍선 층 (모두 장면 폭 기준 %) */
.scene{position:relative;container-type:inline-size;border:3px solid var(--ink);border-radius:22px;overflow:hidden;aspect-ratio:1200/340;margin:0 auto 14px;width:min(100%, max(560px, calc((100dvh - 372px) * 1200 / 340)));box-shadow:0 6px 0 var(--ink);background:#F3DDBA}
.scene > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ppl{position:absolute;inset:0}
.person{position:absolute;bottom:6%;width:8.6%;transform:translateX(-50%);transition:left 1.8s linear, bottom .35s ease-out, opacity .5s;pointer-events:none}
.person.seated{bottom:9%}
.person .flip{transition:transform .2s}
.person.left .flip{transform:scaleX(-1)}
.person svg{display:block;width:100%;height:auto;overflow:visible}
.person.walking svg{animation:bob .45s ease-in-out infinite}
.person.walking .legL{animation:stepL .45s ease-in-out infinite}
.person.walking .legR{animation:stepR .45s ease-in-out infinite}
.person.walking .armL{animation:stepR .45s ease-in-out infinite}
.person.walking .armR{animation:stepL .45s ease-in-out infinite}
.legL,.legR,.armL,.armR{transform-box:fill-box;transform-origin:50% 0}
@keyframes bob{50%{transform:translateY(-2.5%)}}
@keyframes stepL{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes stepR{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.person.sel svg{filter:drop-shadow(0 0 6px rgba(255,214,90,.95)) drop-shadow(0 0 2px rgba(226,85,63,.8))}
.person.gone{opacity:0}
.passer{animation:walkby linear infinite}
.passer .pl{animation:stepL .5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.passer .pr{animation:stepR .5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes walkby{from{transform:translateX(-60px)}to{transform:translateX(300px)}}
.passer.rev{animation-name:walkback}
@keyframes walkback{from{transform:translateX(300px) scaleX(-1)}to{transform:translateX(-60px) scaleX(-1)}}
.steam{animation:steam 2.4s ease-in-out infinite;opacity:.0}
@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
.lamp{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.75}}
.front{position:absolute;left:0;right:0;bottom:0;height:27%;pointer-events:none}
.front svg{width:100%;height:100%;display:block}
.dish{position:absolute;bottom:22%;width:7%;transform:translateX(-50%);animation:dishin .35s ease-out}
@keyframes dishin{from{transform:translate(-50%,-30%);opacity:0}}
.bubs{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;top:2.5%;width:19%;transform:translateX(-50%);pointer-events:auto;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:.7cqw .9cqw .8cqw;text-align:center;box-shadow:0 3px 0 rgba(42,35,32,.2);cursor:pointer}
.bub.enter{animation:bubin .3s ease-out}
@keyframes bubin{from{transform:translate(-50%,10px) scale(.9);opacity:0}}
.bub .kind{display:inline-block;font:800 max(11px,1.35cqw)/1 var(--f-word);letter-spacing:.02em;color:#fff;background:var(--k);border-radius:99px;padding:.45cqw 1cqw;margin-bottom:.2cqw}
.bub .say{display:block;font:800 max(11px,1.45cqw)/1.3 var(--f-word);word-break:keep-all}
.bub.sel{border-color:var(--counter);box-shadow:0 0 0 4px rgba(226,85,63,.4)}
.pat{flex:1;height:.8cqw;min-height:6px}
.patrow{display:flex;align-items:center;gap:.6cqw;margin-top:.5cqw}
.sec{flex:none;font:800 max(10px,1.05cqw)/1 var(--f-word);color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.sec.low{color:var(--no)}
.pat i{display:block;height:100%;background:var(--ok);border:1.5px solid var(--ink);border-radius:99px;transition:width .3s linear;box-sizing:border-box}
.pat i.mid{background:var(--gold)} .pat i.low{background:var(--no)}
.pop{position:absolute;top:28%;transform:translateX(-50%);font:400 max(16px,2.4cqw)/1 var(--f-display);color:var(--ok);text-shadow:0 2px 0 #fff,0 0 6px #fff;animation:rise 1.4s ease-out forwards;pointer-events:none}
.pop.bad{color:var(--no)}
@keyframes rise{to{transform:translate(-50%,-60%);opacity:0}}
.seatlist{display:none;gap:8px;margin:-4px 0 14px}

.srow{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 var(--ink)}
.srow.sel{border-color:var(--counter);box-shadow:0 0 0 3px rgba(226,85,63,.4)}
.srow .kind{flex:none;font:700 11px/1 var(--f-body);color:#fff;background:var(--k);border-radius:99px;padding:4px 8px}
.srow .say{flex:1;font:800 15px/1.3 var(--f-word)}
.srow .pat{flex:none;width:60px;margin:0}
.srow .sec{font-size:13px}

/* 주방 */
.kitchen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px;align-items:start}
.kcol .fb{margin-top:10px}
.card.work{padding:12px 14px}
.wgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.wgrid .side{display:flex;flex-direction:column;gap:8px}
.wgrid .plate-row{margin:0}
.wgrid .reasons{margin:0}
@media (max-width:700px){.wgrid{grid-template-columns:1fr}}
.work .btn{padding:8px 13px;font-size:19px}
.work .reason{word-break:keep-all}
@media (max-width:860px){.kitchen{grid-template-columns:1fr}}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px 16px}
.ticket{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:0 14px 12px;box-shadow:0 5px 0 var(--ink);overflow:visible;
  background-image:repeating-linear-gradient(transparent 0 27px,#EEF3F8 27px 28px);background-position:0 44px}
.ticket::before{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#5FA8E0;border:2.5px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);z-index:1}
.ticket h3{margin:0 -14px 8px;padding:10px 14px 8px;border-radius:9px 9px 0 0;background:#FFE7A8;color:var(--ink);font:400 17px/1.1 var(--f-display);letter-spacing:.04em;border-bottom:2.5px dashed rgba(42,35,32,.6)}
.ticket .big{font:800 23px/1.35 var(--f-word);word-break:keep-all;margin:4px 0}
.ticket .hint{font-size:13.5px;color:var(--muted)}
.empty-k{color:var(--muted);text-align:center;padding:24px 8px;font-weight:600}
.shelf h4{margin:0 0 6px;font:400 17px/1.2 var(--f-display);display:flex;align-items:center;gap:6px}
.shelf h4 small{font:600 12px/1 var(--f-body);color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tile{border:2.5px solid var(--ink);border-radius:12px;padding:6px 14px;font:800 20px/1.2 var(--f-word);box-shadow:0 3px 0 var(--ink);background:#fff;min-width:64px}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tile.stem{background:var(--stem-bg);color:#1D5DA3}
.tile.end{background:var(--end-bg);color:#A8540C;border-radius:22px}
.tile.word{background:#fff}
.tile.on{outline:4px solid var(--counter);outline-offset:1px}
.tile.ox{font-size:40px;min-width:110px;padding:10px 20px}
.blankbox{display:inline-block;width:3.2em;height:1.1em;vertical-align:-.15em;margin:0 .15em;border-bottom:3px solid var(--ink);background:#FFF4C9;border-radius:4px 4px 0 0}
.blank-row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.quiz-in{flex:1;min-width:140px;font:800 24px/1.2 var(--f-word);border:2.5px solid var(--ink);border-radius:12px;padding:8px 14px;background:#fff;box-shadow:inset 0 2px 0 rgba(42,35,32,.08)}
.quiz-in:focus{outline:4px solid rgba(226,85,63,.35);outline-offset:1px}
.plate-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 10px}
.plate{width:min(200px,100%);aspect-ratio:2/1;border-radius:50%;background:radial-gradient(ellipse closest-side,#fff 0 68%,#EFE7DA 69% 76%,#fff 77% 100%);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(42,35,32,.25);font:800 25px/1 var(--f-word);padding:0 18px;flex-wrap:wrap}
.plate .s{color:var(--stem);border-bottom:4px solid var(--stem)}
.plate .e{color:var(--end);border-bottom:4px solid var(--end)}
.plate .ph{color:#C9BFB1;font-size:18px}
.plate.many{font-size:20px;gap:6px;width:min(320px,100%);aspect-ratio:2.2/1;padding:0 36px}
.preview{font:700 19px/1.2 var(--f-word);color:var(--muted)}
.preview b{color:var(--ink);font-weight:400}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2.5px solid var(--ink);border-radius:14px;padding:10px 18px;background:var(--gold);font:400 21px/1.1 var(--f-display);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.serve{background:#7BD49C}
.btn.reject{background:#FF9C8C}
.btn.ghost{background:#fff}
.reasons{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.reason{text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:8px 12px;font:600 15px/1.35 var(--f-body);box-shadow:0 2px 0 var(--ink)}
.reason.on{background:var(--ink);color:#fff}
.fb{border-radius:14px;padding:10px 14px;margin-top:12px;font-weight:600}
.fb b{display:block;font:400 21px/1.2 var(--f-display)}
.fb.ok{background:#E2F5EA;border:2px solid var(--ok)} .fb.ok b{color:var(--ok)}
.fb.no{background:#FDE7E3;border:2px solid var(--no)} .fb.no b{color:var(--no)}
@keyframes fbin{from{transform:translateY(6px);opacity:0}}

/* 시작/결과 */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.sign{background:var(--counter);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px 20px;box-shadow:0 6px 0 var(--ink);text-align:center;margin-bottom:14px}
.sign small{display:block;font:700 12px/1 var(--f-body);letter-spacing:.2em;opacity:.85}
.sign b{display:block;font:400 clamp(40px,6vw,64px)/1.1 var(--f-display);letter-spacing:.02em;text-shadow:0 3px 0 var(--counter-d)}
.menu h3{margin:0 0 8px;font:400 22px/1.2 var(--f-display)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mlist li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-bottom:2px dotted var(--line);padding-bottom:8px}
.mlist li:last-child{border-bottom:0}
.mlist .k{font:700 12px/1 var(--f-body);color:#fff;background:var(--k);border-radius:99px;padding:5px 9px;margin-top:3px;white-space:nowrap}
.mlist p{margin:0;font-size:14.5px;word-break:keep-all}
.mlist p b{font-weight:800}
.set label{display:block;font:400 18px/1.2 var(--f-display);margin:0 0 6px}
.set input{width:100%;font:500 18px/1.2 var(--f-body);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:14px;background:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.opt{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:8px 14px;font:400 19px/1 var(--f-display);box-shadow:0 3px 0 var(--ink)}
.opt.on{background:var(--ink);color:#fff}
.rules{margin:0 0 14px;padding-left:18px;font-size:14.5px;color:var(--muted);word-break:keep-all}
.report{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
@media (max-width:860px){.report{grid-template-columns:1fr}}
.receipt{background:#fff;border:2.5px solid var(--ink);border-radius:6px;padding:18px 18px 14px;box-shadow:0 6px 0 var(--ink);font-variant-numeric:tabular-nums}
.receipt h2{margin:0;text-align:center;font:400 30px/1.1 var(--f-display)}
.receipt .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.rrow{display:flex;justify-content:space-between;border-bottom:1.5px dashed var(--line);padding:6px 0;font-weight:600}
.rrow b{font:400 22px/1 var(--f-display)}
.rrow.sub{padding-left:14px;color:var(--muted);font-size:14px;border-bottom-style:dotted}
.rrow.sub b{font-size:18px}
.rrow.total{border-bottom:0;font-size:18px} .rrow.total b{font-size:32px;color:var(--counter)}
.stars{text-align:center;font-size:40px;letter-spacing:6px;margin:8px 0 4px}
.stars .off{filter:grayscale(1);opacity:.3}
.notes h3{margin:0 0 8px;font:400 22px/1.2 var(--f-display)}
.nlist{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto}
.ni{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}
.ni .o{font-weight:800}
.ni .a{font-size:14px;color:var(--muted)}
.ni .a b{color:var(--ink)}
.pause{position:fixed;inset:0;background:rgba(42,35,32,.55);display:grid;place-items:center;z-index:5;padding:16px}
.pause .card{text-align:center;max-width:360px}
.pause b{display:block;font:400 32px/1.2 var(--f-display);margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ===== 재료 ===== */
const VERBS = [ ['먹','어'],['읽','어'],['웃','어'],['씻','어'],['입','어'],['잡','아'],['찾','아'],['닫','아'],['앉','아'],['감','아'] ];
const ADJS = ['작','높','넓','맑','좋','짧','깊','많','낮','얇'];
const FORM = { cmd:{ name:'명령형', end:v => v + '라' }, sug:{ name:'청유형', end:() => '자' }, pres:{ name:'현재형', end:() => '는다' } };
const ENDS = ['-아라/어라','-자','-는다'];
/* 어간의 마지막 모음이 ㅏ·ㅑ·ㅗ면 '-아라', 아니면 '-어라' */
function harm(st){ const c = st.charCodeAt(st.length - 1) - 0xAC00, v = Math.floor((c % 588) / 28); return [0, 2, 8].includes(v) ? '아' : '어'; }
const endFor = (st, e) => e === '-아라/어라' ? (st ? harm(st) + '라' : '아라/어라') : e.replace(/^-/, '');
const REASON = {
  cmd:'형용사는 명령형 어미와 결합하지 않아요.',
  sug:'형용사는 청유형 어미와 결합하지 않아요.',
  pres:'형용사는 현재형 어미 ‘-ㄴ/는-’과 결합하지 않아요.',
};
const FAKE_REASONS = ['형용사는 활용하지 않아요.','형용사는 서술어로 쓰일 수 없어요.','형용사는 어간이 없어요.'];
const SORT_V = ['가다','뛰다','배우다','달리다','먹다','읽다','웃다','잡다','씻다','놀다','만들다','자라다'];
const SORT_A = ['예쁘다','작다','높다','맑다','춥다','조용하다','귀엽다','넓다','길다','차갑다','빠르다','짧다'];
// 어간·어미 찾기: [활용형, 어간, 어미, 오답들]
const PARTS = [   /* [활용형, 어간, 어미, 어간 오답, 어미 오답(없으면 어간만 물음)] */
  ['읽었다','읽-','-었다',['읽었-','읽었다'],null],
  ['먹고','먹-','-고',['먹고'],null],
  ['작아서','작-','-아서',['작아-','작아서'],['작아서','-서']],
  ['잡으니','잡-','-으니',['잡으-','잡으니'],['잡으니','-니']],
  ['웃으며','웃-','-으며',['웃으-','웃으며'],['웃으며','-며']],
  ['높았다','높-','-았다',['높았-','높았다'],null],
  ['맑고','맑-','-고',['맑고'],null],
  ['찾아라','찾-','-아라',['찾아-','찾아라'],['찾아라','-라']],
  ['씻자','씻-','-자',['씻자'],null],
  ['넓어서','넓-','-어서',['넓어-','넓어서'],['넓어서','-서']],
  ['앉는다','앉-','-는다',['앉는-','앉는다'],null],
  ['깊었다','깊-','-었다',['깊었-','깊었다'],null],
];
const QUIZ = [

function makeOrder(){
  const r = Math.random(), id = ++S.uid, patience = 45, g = makeLook();

    o = { kind:'build', stem:st, base:st + '다', form:f, ok:true, ans:st + FORM[f].end(v) };
  } else if (r < .58){ // 형용사 → 거절해야 함
    const st = pick(ADJS), f = pick(['cmd','sug','pres']);
    o = { kind:'build', stem:st, base:st + '다', form:f, ok:false };
  } else if (r < .73){
    const want = Math.random() < .5 ? '형용사' : '동사', A = shuffle(SORT_A).slice(0, 3), V = shuffle(SORT_V).slice(0, 3);
    o = { kind:'sort', want, words:shuffle([...A.map(w => [w,'형용사']), ...V.map(w => [w,'동사'])]) };
  } else if (r < .87){
    const p = PARTS[nextFrom('pi', PARTS.length)], which = p[4] && Math.random() < .5 ? 'end' : 'stem';
    const right = which === 'stem' ? p[1] : p[2];
    o = { kind:'part', word:p[0], which, right, opts:[right, ...(which === 'stem' ? p[3] : p[4])].sort((a, b) => a.replace(/-/g, '').length - b.replace(/-/g, '').length || (b.endsWith('-') - a.endsWith('-'))) };
  } else {
    const q = QUIZ[nextFrom('qi', QUIZ.length)];
    o = typeof q[1] === 'string' ? { kind:'quiz', blank:true, q:q[0], a:q[1], why:q[2], typed:'' } : { kind:'quiz', q:q[0], a:q[1], why:q[2] };

}
function orderSay(o){
  if (o.kind === 'build') return `‘${o.base}’ ${FORM[o.form].name} 하나요!`;
  if (o.kind === 'sort') return `${o.want}만 담아 주세요!`;
  if (o.kind === 'part') return `‘${o.word}’의 ${o.which === 'stem' ? '어간' : '어미'}만 주세요!`;

  const t0 = AC.currentTime + (w || 0), o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v || .12, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .02); }catch(e){} }
const SFX = {

  bad(){ tone(196,.3,'sawtooth',.06); },

/* ===== 진행 ===== */
let tick = null;
function startShift(){
  Object.assign(S, { phase:'play', left:S.minutes * 60, money:0, seats:[null,null,null], sel:null, done:0, okN:0, rejN:0, missN:0, failN:0, log:[], fb:null, spawnIn:1, paused:false });
  runTick();
}
function runTick(){ clearInterval(tick); tick = setInterval(step, 1000); }
function step(){
  if (S.phase !== 'play' || S.paused) return;
  S.left--; S.spawnIn--;
  S.seats.forEach((o, i) => { if (!o) return; o.left--; if (o.left <= 0){ leave(i, 'miss'); S.dirty = true; } });
  if (S.spawnIn <= 0){
    const free = S.seats.findIndex(x => !x);
    if (free >= 0){ S.seats[free] = makeOrder(); SFX.bell(); S.dirty = true; }
    S.spawnIn = 7 + rnd(5);
  }
  if (S.left <= 0){ clearInterval(tick); S.phase = 'end'; SFX.end(); render(); return; }
  if (S.fb && S.fb.t && Date.now() - S.fb.t > 6000){ S.fb = null; S.dirty = true; }
  if (S.dirty){ S.dirty = false; render(); } else updateLive();
}
const moodOf = o => { const r = o.left / o.patience; return r < .3 ? 'angry' : r < .6 ? 'meh' : 'happy'; };
function updateLive(){
  const tm = document.getElementById('tm'); if (!tm) return render();
  const mm = Math.floor(Math.max(0, S.left) / 60), ss = String(Math.max(0, S.left) % 60).padStart(2, '0');
  tm.textContent = `${mm}:${ss}`; tm.parentElement.classList.toggle('low', S.left <= 30);
  S.seats.forEach((o, i) => {
    if (!o) return;
    const r = o.left / o.patience;
    document.querySelectorAll(`[data-act="seat"][data-i="${i}"] .pat i`).forEach(bar => { bar.style.width = Math.max(0, r * 100) + '%'; bar.className = r < .3 ? 'low' : r < .6 ? 'mid' : ''; });
    document.querySelectorAll(`[data-act="seat"][data-i="${i}"] .sec`).forEach(s => { s.textContent = Math.max(0, o.left) + '초'; s.classList.toggle('low', r < .3); });
    const el = personEl(o), m = moodOf(o);
    if (el && o.arrived && el.dataset.mood !== m){ el.dataset.mood = m; el.querySelector('.flip').innerHTML = personSVG(o.g, m); }
  });
}
function answerText(o){
  if (o.kind === 'build') return o.ok ? `‘${o.ans}’` : `주문 거절 — ${REASON[o.form]}`;
  if (o.kind === 'sort') return o.words.filter(w => w[1] === o.want).map(w => w[0]).join(', ');
  if (o.kind === 'part') return o.right;
  if (o.blank) return `‘${o.a}’ — ${o.why}`;
  return (o.a ? 'O' : 'X') + ' — ' + o.why;
}
function leave(i, how, pts, msg, given){
  const o = S.seats[i]; if (!o) return;
  if (how === 'ok'){ S.okN++; S.money += pts; if (o.kind === 'build' && !o.ok) S.rejN++; }
  else if (how === 'half'){ S.failN = (S.failN || 0) + 1; S.money += pts; S.log.push({ say:orderSay(o), given, right:answerText(o) }); }
  else if (how === 'miss'){ S.missN++; S.money = Math.max(0, S.money - 30); S.log.push({ say:orderSay(o), given:'(시간 초과)', right:answerText(o) }); S.fb = { cls:'no', h:'손님이 기다리다 떠났어요 (−30)', m:`정답: ${answerText(o)}`, t:Date.now() }; SFX.bad(); }
  else { S.failN = (S.failN || 0) + 1; S.money = Math.max(0, S.money - 30); S.log.push({ say:orderSay(o), given, right:answerText(o) }); }
  S.done++;

function walkIn(o, i, instant){

function walkOut(o, i, happy){
  const el = personEl(o); if (!el) return;
  const go = () => { el.classList.remove('seated'); el.classList.add('walking', 'left'); el.style.left = DOOR_X + '%'; setTimeout(() => { el.classList.add('gone'); setTimeout(() => el.remove(), 500); }, 1700); };

    if (o.blank){
      ticket = `<div class="big" style="font-size:24px">${esc(o.q).replace('{}', '<span class="blankbox"></span>')}</div><div class="hint">단골손님의 퀴즈예요. 빈칸에 알맞은 말을 써요.</div>`;
      work = `<div class="shelf"><h4>✏️ 빈칸 채우기</h4><div class="blank-row"><input id="quizIn" class="quiz-in" maxlength="8" autocomplete="off" spellcheck="false" aria-label="빈칸에 들어갈 말"><button class="btn serve" data-act="blank">🛎️ 대답하기</button></div></div>`;
    } else {
    ticket = `<div class="big" style="font-size:24px">${esc(o.q)}</div><div class="hint">단골손님의 퀴즈예요. 맞으면 O, 틀리면 X!</div>`;
    work = `<div class="shelf"><h4>🛎️ 대답하기</h4><div class="tiles"><button class="tile ox" data-act="ox" data-v="1" style="color:var(--ok)">O</button><button class="tile ox" data-act="ox" data-v="0" style="color:var(--no)">X</button></div></div>`;
    }
  }
  return `<div class="kitchen"><div class="kcol"><div class="ticket"><h3>주문서 · ${KINDS[o.kind].label}</h3>${ticket}</div>${fb}</div><div class="card work">${work}</div></div>`;
}
function setupHTML(){
  return `<div class="hero"><div>
    <div class="card menu"><h3>📋 주방 매뉴얼</h3><ul class="mlist">
      <li><span class="k" style="--k:${KINDS.build.color}">활용 주문</span><p>동사는 주문에 맞게 어간과 명령형·청유형·현재형 어미를 결합하여 접시에 담아요. 형용사는 명령형·청유형·현재형 어미와 결합할 수 없으니 주문을 거절하고 이유를 골라요.</p></li>
      <li><span class="k" style="--k:${KINDS.sort.color}">분류 주문</span><p>동사 또는 형용사만 골라 접시에 담아요. 다른 주문보다 매출이 1.5배 높아요.</p></li>
      <li><span class="k" style="--k:${KINDS.part.color}">재료 주문</span><p>활용형에서 어간이나 어미만 골라 내보내요.</p></li>
      <li><span class="k" style="--k:${KINDS.quiz.color}">단골 퀴즈</span><p>용언의 개념과 관련된 퀴즈를 보고 O, X로 답하거나 빈칸에 알맞은 말을 써요.</p></li>
    </ul></div></div>
    <div class="card set">
      <label for="teamName">이름</label><input id="teamName" maxlength="12" value="${esc(S.team)}">
      <label>영업 시간</label><div class="opts">${[3,4,5].map(m => `<button class="opt ${S.minutes === m ? 'on' : ''}" data-act="min" data-v="${m}">${m}분</button>`).join('')}</div>
      <ul class="rules"><li>손님은 최대 3명까지 와요. 손님을 눌러 주문서를 받아요.</li><li>음식을 빨리 낼수록 팁이 많아요. 틀리거나 손님이 기다리다 떠나면 −30원이에요.</li></ul>
      <button class="btn" data-act="open">🔔 영업 시작</button>
    </div></div>`;
}
function endHTML(){
  const total = S.done, rate = total ? S.okN / total : 0, star = rate >= .9 ? 3 : rate >= .7 ? 2 : 1;
  const notes = S.log.length ? S.log.map(l => `<div class="ni"><div class="o">${esc(l.say)}</div><div class="a">우리 답: ${esc(l.given)}<br>정답: <b>${esc(l.right)}</b></div></div>`).join('') : '<div class="empty-k">틀린 주문이 없어요! 완벽한 영업이에요.</div>';
  return `<div class="report"><div class="receipt"><h2>${esc(S.team)} 식당</h2><div class="sub">오늘의 영업 보고서</div>
    <div class="stars">${[1,2,3].map(n => `<span class="${n <= star ? '' : 'off'}">⭐</span>`).join('')}</div>
    <div class="rrow"><span>처리한 주문</span><b>${total}건</b></div>
    <div class="rrow"><span>성공한 주문</span><b>${S.okN}건</b></div>
    <div class="rrow sub"><span>└ 알맞게 거절한 주문</span><b>${S.rejN}건</b></div>
    <div class="rrow"><span>실패한 주문</span><b>${S.failN || 0}건</b></div>
    <div class="rrow"><span>떠난 손님</span><b>${S.missN}명</b></div>
    <div class="rrow total"><span>오늘 매출</span><b>${S.money.toLocaleString()}원</b></div>
    <div class="acts" style="justify-content:center;margin-top:12px"><button class="btn" data-act="again">🔔 다시 영업하기</button></div></div>
    <div class="card notes"><h3>📝 다시 볼 주문</h3><div class="nlist">${notes}</div></div></div>`;
}
function render(){
  const app = document.getElementById('app'), y = window.scrollY;
  const keepName = document.getElementById('teamName'); if (keepName && S.phase === 'setup') S.team = keepName.value;
  if (S.phase === 'play'){
    if (!document.getElementById('scene')) app.innerHTML = sceneShell();
    syncPeople();
    document.getElementById('topbar').innerHTML = topHTML();
    document.getElementById('bubs').innerHTML = bubblesHTML();
    const kit = document.getElementById('kit'), kh = kitchenHTML();
    if (kit.dataset.h !== kh){ kit.innerHTML = kh; kit.dataset.h = kh; const qi = document.getElementById('quizIn'), o = cur(); if (qi && o){ qi.value = o.typed || ''; qi.focus(); } }
    document.getElementById('ovl').innerHTML = S.paused ? `<div class="pause"><div class="card"><b>⏸ 잠깐 멈춤</b><button class="btn" data-act="pause">▶ 다시 영업</button></div></div>` : '';
    document.querySelectorAll('.person').forEach(el => el.classList.toggle('sel', S.sel != null && S.seats[S.sel] && +el.dataset.id === S.seats[S.sel].id));
  } else {
    app.innerHTML = topHTML() + (S.phase === 'setup' ? setupHTML() : endHTML());
  }
  window.scrollTo(0, y);
}
document.addEventListener('input', e => { if (e.target.id === 'quizIn'){ const o = cur(); if (o) o.typed = e.target.value; } });
document.addEventListener('keydown', e => {
  if (e.target.id !== 'quizIn' || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault(); if (S.paused) return; if (actions.blank() !== 'noop') render();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (S.phase === 'play' && S.paused && el.dataset.act !== 'pause' && el.dataset.act !== 'mute') return;
  if (fn(el) === 'noop') return;
  render();
});

function boot(data){ if (data && data.S && data.S.phase){ S = Object.assign(fresh(), data.S); if (S.phase === 'play') runTick(); } render(); }
try{ window.claude?.hot?.snapshot?.(() => ({ S })); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body></html>
